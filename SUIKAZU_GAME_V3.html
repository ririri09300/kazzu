<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スイ和ゲーム</title>
<style>
:root{--bg:#0b1017;--panel:#151d28;--line:#2b3748;--text:#f6f7fb;--muted:#9aa6b7;--accent:#f0c24f;--danger:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#090d13,#101824);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:520px;margin:auto;padding:14px 12px 28px}
h1{font-size:24px;text-align:center;letter-spacing:.08em;margin:4px 0 10px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em}
.stat strong{font-size:18px;white-space:nowrap}
.next{display:flex;gap:8px;align-items:center}
.next img{width:48px;height:44px;object-fit:contain}
.stage{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#080c12}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;gap:10px;margin-top:10px}
button{flex:1;min-height:46px;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
#drop{background:var(--accent);color:#211a06}
#reset{background:#263244;color:white}
.hint{color:var(--muted);font-size:13px;text-align:center;line-height:1.5;margin:10px 0 0}
.legend{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.legend>div:first-child{font-size:12px;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.item{flex:0 0 68px;text-align:center;font-size:10px;color:var(--muted)}
.item img{width:60px;height:54px;object-fit:contain;display:block;margin:auto}
.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05080dc7;backdrop-filter:blur(4px)}
.over.show{display:flex}
.card{width:min(84%,320px);background:#121a25;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.card h2{font-size:28px;margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 14px}
.card button{width:100%;background:var(--accent);color:#211a06}
</style>
</head>
<body>
<div class="wrap">
<h1>スイ和ゲーム</h1>
<div class="top">
<div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
<div class="stat next"><div><small>NEXT</small><strong id="nextName">卵</strong></div><img id="nextImg" alt=""></div>
<div class="stat" style="text-align:right"><small>BEST</small><strong id="best">0</strong></div>
</div>

<div class="stage">
<canvas id="game" width="420" height="650" aria-label="スイ和ゲーム"></canvas>
<div id="over" class="over">
  <div class="card">
    <h2>GAME OVER</h2>
    <p id="final">SCORE 0</p>
    <button id="again" type="button">もう一度</button>
  </div>
</div>
</div>

<div class="controls">
<button id="drop" type="button">ここに落とす</button>
<button id="reset" type="button">リスタート</button>
</div>
<p class="hint">左右に指を動かして位置を決め、タップまたはボタンで落下。<br>同じ料理どうしが触れると次の料理へ進化します。</p>

<div class="legend">
<div>進化順</div>
<div id="evo" class="row"></div>
</div>
</div>

const NAMES=["卵", "明太子", "白ごはん", "明太ごはん", "チャーハン", "餃子", "麺", "ラーメン", "赤いラーメン", "全部のせラーメン"];
const C=[[24.66, 13.14], [22.33, 21.67], [43.88, 16.61], [34.58, 31.5], [54.2, 29.52], [57.66, 39.96], [62.83, 53.54], [69.0, 69.0], [91.6, 71.63], [101.8, 88.65]]; // [rx, ry] for each image-shaped ellipse collider
const POINTS=[1, 3, 6, 10, 15, 21, 28, 36, 45, 60];

const c=document.getElementById('game');
const ctx=c.getContext('2d');
const W=c.width,H=c.height;
const floor=H-12, limit=105;

const imgs=DATA.map(src=>{const im=new Image();im.src=src;return im});
document.getElementById('evo').innerHTML=DATA.map((src,i)=>
  `<div class="item"><img src="${src}" alt="${NAMES[i]}"><span>${NAMES[i]}</span></div>`
).join('');

const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const nextName=document.getElementById('nextName');
const nextImg=document.getElementById('nextImg');
const over=document.getElementById('over');
const finalEl=document.getElementById('final');

let balls=[], aim=W/2, cur=0, next=0, score=0, best=0, id=1;
let can=true, dead=false, last=performance.now(), overflow=0, drag=false;
try{best=+(localStorage.getItem('suiwaBest')||0)}catch(e){}
bestEl.textContent=best;

function randTier(){
  const r=Math.random();
  return r<.50?0:r<.82?1:2;
}
function dims(t){return {rx:C[t][0],ry:C[t][1]}}
function updateNext(){
  nextName.textContent=NAMES[next];
  nextImg.src=DATA[next];
  const d=dims(cur);
  aim=Math.max(d.rx+6,Math.min(W-d.rx-6,aim));
}
function reset(){
  balls=[]; aim=W/2; cur=randTier(); next=randTier(); score=0;
  scoreEl.textContent='0'; dead=false; can=true; overflow=0;
  over.classList.remove('show'); updateNext();
}
function spawn(px,t){
  const d=dims(t);
  balls.push({
    id:id++, x:Math.max(d.rx+4,Math.min(W-d.rx-4,px)), y:d.ry+6,
    vx:0,vy:0,rx:d.rx,ry:d.ry,t,age:0,alive:true
  });
}
function drop(){
  if(!can||dead)return;
  can=false; spawn(aim,cur); cur=next; next=randTier(); updateNext();
  setTimeout(()=>{if(!dead)can=true},420);
}
function setAim(clientX){
  const rect=c.getBoundingClientRect();
  const px=(clientX-rect.left)*W/rect.width;
  const d=dims(cur);
  aim=Math.max(d.rx+6,Math.min(W-d.rx-6,px));
}
c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture?.(e.pointerId);setAim(e.clientX)});
c.addEventListener('pointermove',e=>{if(drag)setAim(e.clientX)});
c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;setAim(e.clientX);drop()});
c.addEventListener('pointercancel',()=>drag=false);
document.getElementById('drop').addEventListener('click',drop);
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('again').addEventListener('click',reset);

function mass(b){return Math.max(1,b.rx*b.ry)}
function radialRadius(b,nx,ny){
  const den=(nx*nx)/(b.rx*b.rx)+(ny*ny)/(b.ry*b.ry);
  return den>0 ? 1/Math.sqrt(den) : Math.max(b.rx,b.ry);
}
function walls(b){
  if(b.x-b.rx<4){b.x=b.rx+4;if(b.vx<0)b.vx*=-.20}
  if(b.x+b.rx>W-4){b.x=W-b.rx-4;if(b.vx>0)b.vx*=-.20}
  if(b.y+b.ry>floor){
    b.y=floor-b.ry;
    if(b.vy>0)b.vy*=-.18;
    b.vx*=.984;
    if(Math.abs(b.vy)<.18)b.vy=0;
  }
}
function collide(a,b,queue){
  if(!a.alive||!b.alive)return;
  const dx=b.x-a.x, dy=b.y-a.y;
  const d2=dx*dx+dy*dy;
  if(d2===0)return;
  const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
  const ra=radialRadius(a,nx,ny), rb=radialRadius(b,nx,ny);
  const target=ra+rb;
  if(d>=target)return;

  const ov=target-d;
  const ia=1/mass(a), ib=1/mass(b), sum=ia+ib;
  a.x-=nx*ov*(ia/sum); a.y-=ny*ov*(ia/sum);
  b.x+=nx*ov*(ib/sum); b.y+=ny*ov*(ib/sum);

  const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
  const vn=rvx*nx+rvy*ny;
  if(vn<0){
    const j=-(1+.07)*vn/sum;
    const ix=j*nx, iy=j*ny;
    a.vx-=ix*ia; a.vy-=iy*ia;
    b.vx+=ix*ib; b.vy+=iy*ib;
  }

  if(a.t===b.t && a.t<C.length-1) queue.push([a,b]);
}
function mergePairs(queue){
  const used=new Set();
  for(const [a,b] of queue){
    if(!a.alive||!b.alive||used.has(a.id)||used.has(b.id)||a.t!==b.t||a.t>=C.length-1)continue;
    used.add(a.id); used.add(b.id);
    a.alive=false; b.alive=false;
    const t=a.t+1, d=dims(t);
    balls.push({
      id:id++, x:(a.x+b.x)/2, y:(a.y+b.y)/2,
      vx:(a.vx+b.vx)/2, vy:Math.min((a.vy+b.vy)/2-1.1,-.45),
      rx:d.rx,ry:d.ry,t,age:0,alive:true
    });
    score+=POINTS[t]*10;
    scoreEl.textContent=String(score);
    if(score>best){
      best=score; bestEl.textContent=String(best);
      try{localStorage.setItem('suiwaBest',String(best))}catch(e){}
    }
  }
  balls=balls.filter(b=>b.alive);
}
function drawFood(b,alpha=1){
  const im=imgs[b.t];
  ctx.save();
  ctx.globalAlpha=alpha;
  if(im.complete&&im.naturalWidth){
    ctx.drawImage(im,b.x-b.rx,b.y-b.ry,b.rx*2,b.ry*2);
  }else{
    ctx.fillStyle='#ddd';
    ctx.beginPath();ctx.ellipse(b.x,b.y,b.rx,b.ry,0,0,Math.PI*2);ctx.fill();
  }
  // Very subtle outline = actual collision ellipse.
  ctx.strokeStyle='rgba(255,255,255,.14)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(b.x,b.y,b.rx,b.ry,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function checkGameOver(now){
  const bad=balls.some(b=>b.age>1200 && b.y-b.ry<limit && Math.abs(b.vy)<1.6);
  if(bad){
    if(!overflow)overflow=now;
    if(now-overflow>2200){
      dead=true; can=false; finalEl.textContent='SCORE '+score; over.classList.add('show');
    }
  }else overflow=0;
}
function render(){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.setLineDash([8,8]);
  ctx.strokeStyle=overflow?'#ff6b6b':'rgba(255,107,107,.45)';
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,limit);ctx.lineTo(W-8,limit);ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle='rgba(255,107,107,.75)';ctx.font='12px sans-serif';ctx.fillText('LIMIT',12,limit-8);
  ctx.restore();

  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(4,floor);ctx.lineTo(W-4,floor);ctx.lineTo(W-4,0);ctx.stroke();

  balls.forEach(b=>drawFood(b,1));

  if(!dead){
    const d=dims(cur), py=d.ry+6;
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(aim,0);ctx.lineTo(aim,6);ctx.stroke();ctx.restore();
    drawFood({x:aim,y:py,rx:d.rx,ry:d.ry,t:cur},can?.92:.42);
  }
}
function loop(now){
  const dt=Math.min(2.1,(now-last)/16.6667||1); last=now;
  if(!dead){
    for(const b of balls){
      b.age+=16.6667*dt;
      b.vy+=.235*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      b.vx*=Math.pow(.992,dt);
      walls(b);
    }
    for(let pass=0;pass<5;pass++){
      const queue=[];
      for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)collide(balls[i],balls[j],queue);
      if(queue.length)mergePairs(queue);
    }
    checkGameOver(now);
  }
  render();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
